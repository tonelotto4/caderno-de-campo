<style>
:root{
  --bg:#f3f5ef; --surface:#ffffff; --ink:#1d2a22; --muted:#66756b; --line:#d5dccf;
  --accent:var(--mod-a,#2f6b3f); --accent-ink:#ffffff; --accent-soft:var(--mod-s,#e0eddd); --warn:#a4561a; --warn-soft:#fbead8;
  --danger:#a8322b; --key:#eef1ea;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141b16; --surface:#1d2721; --ink:#e6ede6; --muted:#9bab9f; --line:#33423a;
    --accent:var(--mod-a,#7fc58f); --accent-ink:#0f1c13; --accent-soft:var(--mod-s,#25382b); --warn:#e3a264; --warn-soft:#3a2b1c;
    --danger:#ee8b84; --key:#26322b;
  }
}
:root[data-theme="dark"]{
  --bg:#141b16; --surface:#1d2721; --ink:#e6ede6; --muted:#9bab9f; --line:#33423a;
  --accent:var(--mod-a,#7fc58f); --accent-ink:#0f1c13; --accent-soft:var(--mod-s,#25382b); --warn:#e3a264; --warn-soft:#3a2b1c;
  --danger:#ee8b84; --key:#26322b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 14px 120px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 2px 10px}
header.top h1{font-size:1.2rem;margin:0;font-weight:700}
header.top small{color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
section.card h2{font-size:.95rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:52px;padding:12px 6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600}
#seg-mod button{font-size:.88rem;padding:12px 2px;min-width:0}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.big{width:100%;text-align:left;padding:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:50px;display:flex;justify-content:space-between;align-items:center}
.big .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.big .u{color:var(--muted);font-size:.85rem}
.big.empty .v{color:var(--muted);font-weight:400}
.big.bad{border-color:var(--danger)}
input.txt{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;min-height:50px}
input.txt:focus,.big:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sub{display:flex;gap:8px;align-items:stretch}
.sub .step{width:54px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.4rem;font-weight:700}
.sub .big{flex:1;justify-content:center;text-align:center}
.ac{position:relative}
.ac ul{list-style:none;margin:4px 0 0;padding:4px;position:absolute;left:0;right:0;z-index:5;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ac li{padding:11px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.ac li[aria-selected="true"],.ac li:active{background:var(--accent-soft)}
.ac li i{color:var(--muted);font-style:normal;font-size:.85rem}
.ac li.add{color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);font-size:.9rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.msg{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.92rem}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.err{background:var(--warn-soft);color:var(--danger)}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.savebar .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.primary{flex:1;padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.45}
.ghost{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.ghost.danger{color:var(--danger)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
/* keypad sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:1rem}
.sheet .hint{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.disp{font-size:2rem;font-weight:700;text-align:right;padding:8px 10px;border-radius:10px;background:var(--key);min-height:58px;font-variant-numeric:tabular-nums}
.disp.bad{color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{padding:16px 0;border:0;border-radius:12px;background:var(--key);font-size:1.4rem;font-weight:700}
.pad button.ok{background:var(--accent);color:var(--accent-ink);grid-column:span 3;font-size:1.1rem}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grid50{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.grid50 button{padding:12px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.grid50 button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* list */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.num{font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.actions .primary,.actions .danger{grid-column:span 2}
.conf{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:.9rem}
.conf p{margin:4px 0}
.conf .row2{display:flex;gap:8px;margin-top:8px}
.conf .row2 .ghost{flex:1;padding:10px 6px}
.conf .done{color:var(--accent);font-weight:700}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:10px}
.brand img{height:46px;width:auto;display:block}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.titlebar h1{font-size:1.05rem;margin:0;font-weight:700;line-height:1.2}
.titlebar small{color:var(--muted)}
.theme{width:48px;height:48px;padding:0;font-size:1.4rem;line-height:1;flex:none}
section.card{border-top:5px solid var(--accent)}
.savebar{border-top:3px solid var(--accent)}
.counter{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.counter.none{font-weight:400;color:var(--muted)}
.counter .last{font-weight:400;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.bk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding:8px 10px;border:1.5px dashed var(--rule);background:var(--surface);font-family:var(--mono);font-size:.82rem;border-radius:3px}
.bk.ok{border-color:var(--accent)}
.bk.warn{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:700}
.bk button{padding:8px 10px;font-size:.85rem;flex:none}
.empty-state{padding:28px 12px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:40;font-weight:600;display:none;max-width:90%}
.toast.show{display:block}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}

/* ===== Tema: ficha de campo em papel ===== */
:root{
  --bg:#efe8d2; --surface:#fffdf3; --ink:#1f2a33; --muted:#6a685a; --line:#c4cbcf; --rule:#46525c;
  --head:#e8dfc2; --entry:rgba(255,236,140,.28); --zebra:rgba(60,50,20,.045); --ruled:rgba(70,110,150,.14); --margin:rgba(190,60,60,.35);
  --shadow:rgba(40,30,10,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1915; --surface:#25231d; --ink:#ece6d2; --muted:#a49e88; --line:#403d33; --rule:#8d8772;
    --head:#35322a; --entry:rgba(255,255,255,.05); --zebra:rgba(255,255,255,.035); --ruled:rgba(220,205,160,.07); --margin:rgba(220,110,110,.3);
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1915; --surface:#25231d; --ink:#ece6d2; --muted:#a49e88; --line:#403d33; --rule:#8d8772;
  --head:#35322a; --entry:rgba(255,255,255,.05); --zebra:rgba(255,255,255,.035); --ruled:rgba(220,205,160,.07); --margin:rgba(220,110,110,.3);
  --shadow:rgba(0,0,0,.5);
}
:root{--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;--serif:Georgia,"Times New Roman",serif}
body{background-color:var(--bg);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--ruled) 27px,var(--ruled) 28px)}
body::before{content:"";position:fixed;top:0;bottom:0;left:9px;width:2px;background:var(--margin);pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.brand{border-radius:3px;border:1.5px solid var(--rule);border-bottom:5px double var(--rule);box-shadow:2px 3px 0 var(--shadow)}
.titlebar h1{font-family:var(--serif);font-size:1.15rem;letter-spacing:.01em}
.titlebar small{font-family:var(--mono);font-size:.8rem}
.theme{border-radius:3px}
/* abas como índice de caderno */
.tabs{gap:3px;margin-bottom:14px;border-bottom:1.5px solid var(--rule)}
.tabs button{border:1.5px solid var(--rule);border-bottom:0;border-radius:8px 8px 0 0;background:var(--head);color:var(--muted);padding:9px 6px 8px;font-family:var(--serif);font-size:1rem}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-top:5px solid var(--accent);margin-bottom:-1.5px;padding-top:6px;padding-bottom:10px}
/* blocos da ficha */
section.card{background:var(--surface);border:1.5px solid var(--rule);border-radius:3px;padding:12px 12px 6px;box-shadow:2px 3px 0 var(--shadow);margin-bottom:16px}
section.card h2{margin:-12px -12px 12px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font:700 .74rem/1.1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;border-bottom:1.5px solid var(--rule)}
.field label{font:600 .7rem/1.2 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
input.txt,textarea.txt{border:0;border-bottom:2px solid var(--rule);border-radius:0;background:var(--entry);padding:10px 8px;font-family:var(--mono);font-size:1.12rem;color:var(--ink)}
input.txt:focus{border-bottom-color:var(--accent);background:var(--accent-soft)}
.big{border:0;border-bottom:2px solid var(--rule);border-radius:0;background:var(--entry);padding:10px 8px}
.big .v{font-family:var(--mono)}
.big .u{font-family:var(--mono)}
.big.bad{border-bottom-color:var(--danger)}
.seg button,.sub .step,.grid50 button{border:1.5px solid var(--rule);border-radius:0;background:var(--surface);font-family:var(--mono)}
.seg button[aria-pressed="true"],.grid50 button.on{background:var(--accent);border-color:var(--rule);color:var(--accent-ink)}
.seg{gap:0}.seg button{margin-left:-1.5px}.seg button:first-child{margin-left:0}
#seg-mod button{font-size:.86rem}
/* medidas como quadro de células */
.card .row{gap:0;border:1.5px solid var(--rule);margin-bottom:10px}
.card .row>.field{margin:0;padding:8px 10px}
.card .row>.field+.field{border-left:1px solid var(--line)}
.chip{border-radius:3px;font-family:var(--mono);border:1.5px solid var(--rule);background:var(--surface)}
.chip.on{background:var(--accent-soft);color:var(--ink)}
.ac ul{border-radius:3px;border:1.5px solid var(--rule);box-shadow:3px 4px 0 var(--shadow)}
.ac li{border-radius:0;font-family:var(--mono);border-bottom:1px dotted var(--line)}
.msg{border-radius:3px;border:1px dashed var(--rule)}
.counter{border-radius:0;border:1.5px dashed var(--rule);font-family:var(--mono);font-size:.92rem}
/* botões carimbados */
.primary{border-radius:3px;border:1.5px solid var(--rule);box-shadow:2px 2px 0 var(--shadow);font-family:var(--serif);letter-spacing:.02em}
.primary:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.ghost{border-radius:3px;border:1.5px solid var(--rule);background:var(--surface);font-family:var(--serif)}
.savebar{background:var(--bg);border-top:2px solid var(--rule);box-shadow:0 -3px 0 var(--shadow);z-index:10}
.toast{border-radius:3px;font-family:var(--mono)}
/* planilha de registros */
.tw{border:1.5px solid var(--rule);border-radius:3px;background:var(--surface);box-shadow:2px 3px 0 var(--shadow)}
table{border-collapse:collapse}
th,td{border:1px solid var(--line);padding:7px 9px}
th{background:var(--head);color:var(--ink);font:700 .7rem/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid var(--rule)}
td{font-family:var(--mono)}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.num{text-align:right}
/* teclado numérico */
.sheet{border-radius:12px 12px 0 0;border-top:5px solid var(--accent);background:var(--surface)}
.sheet h3{font-family:var(--serif)}
.disp{border-radius:0;border-bottom:2px solid var(--rule);background:var(--entry);font-family:var(--mono)}
.pad button{border-radius:3px;border:1.5px solid var(--rule);background:var(--surface);font-family:var(--mono);box-shadow:1px 2px 0 var(--shadow)}
.pad button.ok{background:var(--accent);color:var(--accent-ink);font-family:var(--serif)}
.pad button:active{transform:translate(1px,1px);box-shadow:none}
.conf{border-radius:3px;border:1.5px dashed var(--rule)}
@media (prefers-reduced-motion:reduce){.primary:active,.pad button:active{transform:none}}
/* ===== v2.3 ===== */
textarea.txt{width:100%;display:block;min-height:84px;resize:vertical;line-height:1.35}
textarea.txt:focus{outline:3px solid var(--accent);outline-offset:1px;border-bottom-color:var(--accent);background:var(--accent-soft)}
.ghost.dng{color:var(--danger)}

/*inicio das fontes*/
section.card summary{
   margin:-12px -12px 0;padding:8px 12px;
  background:var(--accent);color:var(--accent-ink);
  font:700 .74rem/1.1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  border-bottom:1.5px solid var(--rule);
  cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;
}
section.card summary::-webkit-details-marker{display:none}
section.card summary::after{content:"▾";font-size:1.1rem}
section.card details:not([open]) summary::after{content:"▸"}
section.card details[open] summary{margin-bottom:12px}

section.card h2{
  margin:-12px -12px 0;padding:8px 12px;
  background:var(--accent);color:var(--accent-ink);
  font:700 .95rem/1.1 "Times New Roman",Times,serif;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1.5px solid var(--rule);
  cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;
}
/*fontes times das seções*/
section.card h2,
section.card summary{
  font-family:"Times New Roman",Times,serif;
  font-size:.95rem;
  letter-spacing:.08em;
  font-weight:700;
}
/*fontes de subtítulo*/
section.card label{padding-top:10px}
}


/*fim das fontes*/
</style>

const DICT_DATA = {"Annonaceae": ["Annona sylvatica"], "Apocynaceae": ["Aspidosperma australe", "Aspidosperma polyneuron", "Rauvolfia sellowii", "Tabernaemontana catharinensis"], "Araliaceae": ["Aralia warmingiana", "Dendropanax cuneatus"], "Arecaceae": ["Euterpe edulis", "Syagrus romanzoffiana"], "Bignoniaceae": ["Jacaranda puberula"], "Boraginaceae": ["Cordia americana", "Cordia ecalyculata", "Cordia trichotoma"], "Cannabaceae": ["Trema micrantha"], "Caricaceae": ["Jacaratia spinosa"], "Cardiopteridaceae": ["Citronella paniculata"], "Celastraceae": ["Monteverdia aquifolium", "Monteverdia gonoclados"], "Chrysobalanaceae": ["Hirtella hebeclada"], "Clusiaceae": ["Garcinia gardneriana"], "Euphorbiaceae": ["Actinostemon concolor", "Alchornea glandulosa", "Alchornea triplinervia", "Tetrorchidium rubrivenium"], "Fabaceae": ["Apuleia leiocarpa", "Bauhinia forficata", "Calliandra foliolosa", "Dahlstedtia muehlbergiana", "Enterolobium contortisiliquum", "Holocalyx balansae", "Inga marginata", "Inga striata", "Machaerium paraguariense", "Machaerium stipitatum", "Muellera campestris", "Myrocarpus frondosus", "Parapiptadenia rigida", "Peltophorum dubium", "Pseudalbizzia polycephala", "Senegalia polyphylla"], "Lamiaceae": ["Aegiphila mediterranea"], "Lauraceae": ["Endlicheria paniculata", "Nectandra lanceolata", "Nectandra megapotamica", "Ocotea diospyrifolia", "Ocotea puberula"], "Loganiaceae": ["Strychnos brasiliensis"], "Malvaceae": ["Bastardiopsis densiflora", "Ceiba speciosa", "Heliocarpus popayanensis"], "Melastomataceae": ["Miconia collatata"], "Meliaceae": ["Cabralea canjerana", "Cedrela fissilis", "Guarea kunthiana", "Trichilia catigua", "Trichilia elegans", "Trichilia pallida"], "Monimiaceae": ["Hennecartia omphalandra"], "Moraceae": ["Ficus adhatodifolia", "Ficus guaranitica", "Maclura tinctoria", "Sorocea bonplandii"], "Myrtaceae": ["Campomanesia xanthocarpa", "Eugenia burkartiana", "Eugenia florida", "Eugenia involucrata", "Eugenia ramboi", "Eugenia subterminalis", "Myrceugenia glaucescens", "Myrcia selloi", "Plinia rivularis"], "Nyctaginaceae": ["Pisonia ambigua"], "Polygonaceae": ["Ruprechtia laxiflora"], "Primulaceae": ["Myrsine loefgrenii", "Myrsine umbellata"], "Proteaceae": ["Roupala montana"], "Rosaceae": ["Prunus myrtifolia"], "Rubiaceae": ["Coussarea contracta", "Simira hexandra"], "Rutaceae": ["Balfourodendron riedelianum", "Citrus aurantium", "Esenbeckia febrifuga", "Pilocarpus pennatifolius", "Zanthoxylum caribaeum", "Zanthoxylum rhoifolium"], "Salicaceae": ["Banara tomentosa", "Casearia decandra", "Casearia gossypiosperma", "Casearia lasiophylla", "Casearia sylvestris", "Prockia crucis"], "Sapindaceae": ["Allophylus edulis", "Cupania vernalis", "Diatenopteryx sorbifolia"], "Sapotaceae": ["Chloroluma gonocarpa", "Chrysophyllum marginatum"], "Solanaceae": ["Solanum trachytrichium"], "Urticaceae": ["Cecropia pachystachya"]};
const MODULOS = ["Foz","Céu Azul","Serranópolis"];
const LIMITS = {
  dbh:{label:"DBH1 (CAP)",unit:"cm",min:0.1,max:600,dec:1,quick:[]},
  h:{label:"Height (altura)",unit:"m",min:0.1,max:60,dec:1,quick:[]},
  x:{label:"X",unit:"m",min:0.01,max:10,dec:2,quick:[0.5,1,2.5,5,7.5,10]},
  y:{label:"Y",unit:"m",min:0.01,max:10,dec:2,quick:[0.5,1,2.5,5,7.5,10]},
  id:{label:"ID (nº da árvore)",unit:"",min:1,max:999999,dec:0,quick:[],maxInt:6}
};
const KEY_DATA="peld_records_v1", KEY_CTX="peld_ctx_v1", KEY_DICT="peld_dict_extra_v1", KEY_TRASH="peld_trash_v1", KEY_BK="peld_lastbackup_v1", KEY_DRAFT="peld_draft_v1";
const MIRROR=new Set([KEY_DATA,KEY_DICT,KEY_TRASH]);
let storageFail=false;
const $=id=>document.getElementById(id);

/* ---------- storage ---------- */
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){
  let ok=true;
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){ok=false}
  if(MIRROR.has(k))idbSet(k,v);            // cópia interna de segurança
  if(!ok){storageFail=true;showWarn();toast("Não consegui salvar no aparelho. Faça um backup agora.")}
}
function showWarn(){const w=$("warn");if(w&&storageFail)w.classList.remove("hidden")}
let idbP=null;
function idb(){if(!idbP)idbP=new Promise(res=>{try{const rq=indexedDB.open("peld_mirror",1);rq.onupgradeneeded=()=>rq.result.createObjectStore("kv");rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}});return idbP}
async function idbSet(k,v){const db=await idb();if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(JSON.stringify(v),k)}catch(e){}}
async function idbGet(k){const db=await idb();if(!db)return null;return new Promise(res=>{try{const rq=db.transaction("kv").objectStore("kv").get(k);rq.onsuccess=()=>res(rq.result?JSON.parse(rq.result):null);rq.onerror=()=>res(null)}catch(e){res(null)}})}

/* ---------- text normalisation ---------- */
const clean=s=>(s||"").replace(/\s+/g," ").trim();
const fold=s=>clean(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function fmtFamily(s){s=clean(s);return s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():""}
function fmtSpecies(s){const p=clean(s).split(" ");if(!p[0])return"";p[0]=p[0].charAt(0).toUpperCase()+p[0].slice(1).toLowerCase();for(let i=1;i<p.length;i++)p[i]=p[i].toLowerCase();return p.join(" ")}

/* ---------- state ---------- */
let records=load(KEY_DATA,[]);
let extra=load(KEY_DICT,[]);            // [{f,s}]
let ctx=Object.assign({mod:"",par:0,fai:0,sub:0,by:"",lado:""},load(KEY_CTX,{}));
if(!(ctx.sub>=1&&ctx.sub<=25))ctx.sub=0;            // subparcelas de campo: 1 a 25 (D e E = 50)
if(ctx.lado!=="D"&&ctx.lado!=="E")ctx.lado="";
let cur={id:"",fam:"",esp:"",dbh:null,dbhs:[],h:null,x:null,y:null,flag:"",obs:""};
try{localStorage.removeItem("peld_undo_v1")}catch(e){}   // restos da versão anterior do Desfazer
const cleanObs=v=>String(v==null?"":v).replace(/[ \t]+/g," ").replace(/[ \t]*\n[ \t]*/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
const newUid=()=>((clean(ctx.by)||"x").replace(/[^A-Za-z0-9]/g,"").slice(0,8))+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
if(records.some(r=>!r.uid)){records.forEach(r=>{if(!r.uid)r.uid="old-"+r.t+"-"+Math.random().toString(36).slice(2,7)});save(KEY_DATA,records)}
$("f-by").value=ctx.by||"";
const MODCOL={
  "Foz":{l:"#0a7a80",ls:"#d9eeee",d:"#5fcfd4",ds:"#1c3a3b"},
  "Céu Azul":{l:"#2b63b0",ls:"#dde8f6",d:"#7db0f0",ds:"#1f3049"},
  "Serranópolis":{l:"#b4560f",ls:"#f8e6d5",d:"#f0a566",ds:"#3d2a19"}
};
const KEY_THEME="peld_theme_v1";
let themePref=load(KEY_THEME,"");           // "", "light" ou "dark" (vazio = segue o aparelho)
const mq=window.matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>themePref?themePref==="dark":mq.matches;
const modColor=m=>MODCOL[m]?(isDark()?MODCOL[m].d:MODCOL[m].l):"var(--accent)";
function applyTheme(){
  const r=document.documentElement,st=r.style,c=MODCOL[ctx.mod];
  if(themePref)r.dataset.theme=themePref;else r.removeAttribute("data-theme");
  if(c){st.setProperty("--mod-a",isDark()?c.d:c.l);st.setProperty("--mod-s",isDark()?c.ds:c.ls)}
  else{st.removeProperty("--mod-a");st.removeProperty("--mod-s")}
  const b=$("btn-theme");b.textContent=isDark()?"☀":"☾";
  b.setAttribute("aria-label",isDark()?"Mudar para modo claro":"Mudar para modo escuro");
  [...$("seg-mod").children].forEach((x,i)=>{x.style.borderLeft="6px solid "+modColor(MODULOS[i])});
}
$("btn-theme").onclick=()=>{themePref=isDark()?"light":"dark";save(KEY_THEME,themePref);applyTheme();renderRecords()};
mq.addEventListener&&mq.addEventListener("change",()=>{if(!themePref){applyTheme();renderRecords()}});
function renderCounter(){
  const box=$("sub-count");
  if(!(ctx.mod&&ctx.par&&ctx.fai&&ctx.sub&&ctx.lado)){box.className="counter none";box.textContent="Escolha módulo, parcela, faixa, subparcela e lado";return}
  const list=records.filter(r=>r.mod===ctx.mod&&r.par===ctx.par&&r.fai===ctx.fai&&r.sub===ctx.sub&&(r.lado||"")===ctx.lado);
  const n=list.length;box.className="counter"+(n?"":" none");
  const last=n?list.reduce((a,b)=>b.t>=a.t?b:a):null;
  box.innerHTML="<span>"+n+(n===1?" árvore salva":" árvores salvas")+" nesta subparcela · lado "+ctx.lado+"</span>"+(last?'<span class="last">Última: '+esc(last.id)+"</span>":"");
}
$("f-by").addEventListener("input",e=>{ctx.by=e.target.value;saveCtx();updateSave()});

function dictionary(){
  const out=[];
  for(const [fam,list] of Object.entries(DICT_DATA)) for(const s of list) out.push({f:fam,s});
  for(const e of extra) if(!out.some(o=>fold(o.s)===fold(e.s))) out.push(e);
  return out;
}
function families(){return [...new Set(dictionary().map(d=>d.f))].sort((a,b)=>a.localeCompare(b))}

/* ---------- segmented buttons ---------- */
function seg(el,opts,get,set){
  el.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.textContent=o.label;b.setAttribute("aria-pressed",String(get()===o.value));
    b.onclick=()=>{set(o.value);saveCtx();renderCtx();updateSave()};
    el.appendChild(b);
  });
}
function renderCtx(){
  seg($("seg-mod"),MODULOS.map(m=>({label:m,value:m})),()=>ctx.mod,v=>ctx.mod=v);
  seg($("seg-par"),[1,2,3,4,5].map(n=>({label:n,value:n})),()=>ctx.par,v=>ctx.par=v);
  seg($("seg-fai"),[2,3].map(n=>({label:n,value:n})),()=>ctx.fai,v=>ctx.fai=v);
  $("sub-v").textContent=ctx.sub?("Subparcela "+ctx.sub):"Escolher";
  renderLado();applyTheme();renderCounter();
}
function saveCtx(){save(KEY_CTX,ctx)}
function stepSub(d){ctx.sub=Math.min(25,Math.max(1,(ctx.sub||(d>0?0:2))+d));saveCtx();renderCtx();updateSave();checkDup()}
$("sub-prev").onclick=()=>stepSub(-1);
$("sub-next").onclick=()=>stepSub(1);

/* ---------- sheets ---------- */
function openSheet(html){$("sheet").innerHTML=html;$("sheet-bg").classList.add("open")}
function askConfirm(title,msg,okLabel,onOk,twoStep,safe,cancelLabel){
  openSheet(`<h3>${esc(title)}</h3><p style="margin:6px 0 14px">${msg}</p>
    <div style="display:flex;gap:8px"><button class="ghost" id="cf-no" style="flex:1;padding:14px">${esc(cancelLabel||"Cancelar")}</button>
    <button class="primary" id="cf-yes" style="flex:1;${safe?"":"background:var(--danger);color:#fff"}">${esc(okLabel)}</button></div>`);
  let armed=!twoStep;
  $("cf-no").onclick=closeSheet;
  $("cf-yes").onclick=()=>{
    if(!armed){armed=true;$("cf-yes").textContent="Toque de novo para confirmar";return}
    closeSheet();onOk();
  };
}
function closeSheet(){$("sheet-bg").classList.remove("open");$("sheet").innerHTML=""}
$("sheet-bg").addEventListener("click",e=>{if(e.target===$("sheet-bg"))closeSheet()});

$("sub-open").onclick=()=>{
  let h='<h3>Subparcela (1 a 25)</h3><div class="grid50">';
  for(let i=1;i<=25;i++)h+=`<button data-n="${i}" class="${ctx.sub===i?"on":""}">${i}</button>`;
  openSheet(h+"</div>");
  $("sheet").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ctx.sub=+b.dataset.n;saveCtx();renderCtx();closeSheet();updateSave();checkDup()});
};

/* ---------- numeric keypad ---------- */
function fmtNum(v,dec){return v==null?"":Number(v).toFixed(dec).replace(".",",")}
function openKeypad(key,idx){
  const ex=key==="dbhx";
  const L=Object.assign({},LIMITS[ex?"dbh":key]);if(ex)L.label="DBH"+(idx+2)+" (CAP)";
  const init=ex?cur.dbhs[idx]:cur[key];
  let txt=init!=null?String(init).replace(".",","):"";
  if(key==="id"&&!/^\d+$/.test(txt))txt="";
  const nid=key==="id"?nextId():null;
  openSheet(`<h3>${L.label}</h3><div class="hint">${L.dec===0?"Só números inteiros · de "+L.min+" a "+L.max:"Entre "+fmtNum(L.min,L.dec)+" e "+fmtNum(L.max,L.dec)+" "+L.unit+" · até "+L.dec+" casa(s) decimal(is)"}</div>
  <div class="disp" id="kp-d"></div>
  ${nid?'<div class="quick"><button class="chip on" data-nid="1">Próximo: '+nid.id+' (após '+nid.after+')</button></div>':""}
  ${L.quick.length?'<div class="quick">'+L.quick.map(q=>`<button class="chip" data-q="${q}">${fmtNum(q,L.dec)}</button>`).join("")+"</div>":""}
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
  ${L.dec===0?'<button disabled style="visibility:hidden">.</button>':'<button data-k=",">,</button>'}<button data-k="0">0</button><button data-k="del" aria-label="Apagar">⌫</button>
  <button class="ok" id="kp-ok">Confirmar</button></div>`);
  const disp=$("kp-d"),ok=$("kp-ok");
  const val=()=>txt===""?null:parseFloat(txt.replace(",","."));
  const valid=()=>{const v=val();return v!=null&&!isNaN(v)&&v>=L.min&&v<=L.max};
  function draw(){disp.textContent=txt||"0";const v=val();disp.classList.toggle("bad",txt!==""&&!valid());ok.disabled=!valid();ok.style.opacity=valid()?1:.4}
  function press(k){
    if(k==="del"){txt=txt.slice(0,-1)}
    else if(k===","){if(txt.includes(",")||L.dec===0)return;txt=(txt||"0")+","}
    else{
      const [i,d]=txt.split(",");
      if(d!==undefined&&d.length>=L.dec)return;
      if(d===undefined&&i.length>=(L.maxInt||3))return;
      txt=(i==="0"&&d===undefined)?k:txt+k;
    }
    draw();
  }
  $("sheet").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
  $("sheet").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{txt=fmtNum(+b.dataset.q,L.dec).replace(/,?0+$/,m=>m.includes(",")?"":m);draw()});
  const nb=$("sheet").querySelector("[data-nid]");if(nb)nb.onclick=()=>{txt=nid.id;draw()};
  ok.onclick=()=>{if(!valid())return;const v=Math.round(val()*Math.pow(10,L.dec))/Math.pow(10,L.dec);if(ex)cur.dbhs[idx]=v;else if(key==="id")cur.id=String(v);else cur[key]=v;closeSheet();renderNums();updateSave();checkDup()};
  draw();
}
function renderNums(){
  {const bi=$("n-id");bi.classList.toggle("empty",!cur.id);bi.querySelector(".v").textContent=cur.id||"Tocar";$("f-id").value=cur.id||""}
  for(const [k,id] of [["dbh","n-dbh"],["h","n-h"],["x","n-x"],["y","n-y"]]){
    const b=$(id),v=cur[k];
    b.classList.toggle("empty",v==null);
    b.querySelector(".v").textContent=v==null?"Tocar":fmtNum(v,LIMITS[k].dec);
  }
  const box=$("extra-dbh");box.innerHTML="";
  cur.dbhs.forEach((v,i)=>{
    const d=document.createElement("div");d.className="field";
    d.innerHTML=`<label>DBH${i+2} (CAP) · ramificação</label><div class="sub"><button class="big ${v==null?"empty":""}" data-d="${i}"><span class="v">${v==null?"Tocar":fmtNum(v,1)}</span><span class="u">cm</span></button><button class="step" data-rm="${i}" aria-label="Remover DBH${i+2}">✕</button></div>`;
    box.appendChild(d);
  });
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>openKeypad("dbhx",+b.dataset.d));
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cur.dbhs.splice(+b.dataset.rm,1);renderNums();updateSave()});
  $("add-dbh").disabled=cur.dbhs.length>=15;
}
$("add-dbh").onclick=()=>{if(cur.dbhs.length>=15)return;cur.dbhs.push(null);renderNums();updateSave();openKeypad("dbhx",cur.dbhs.length-1)};
[["dbh","n-dbh"],["h","n-h"],["x","n-x"],["y","n-y"]].forEach(([k,id])=>$(id).onclick=()=>openKeypad(k));

/* ---------- autocomplete ---------- */
function makeAC(input,ul,getItems,onPick,allowNew,fmtNew,getOther){
  let sel=-1,items=[],bt=null;
  function render(){
    const q=fold(input.value);
    const all=getItems();
    items=(q?all.filter(i=>fold(i.label).includes(q)):all.slice(0,30))
      .sort((a,b)=>{const pa=fold(a.label).startsWith(q)?0:1,pb=fold(b.label).startsWith(q)?0:1;return pa-pb||a.label.localeCompare(b.label)}).slice(0,30);
    if(getOther&&q.length>=3)items=items.concat(getOther(q).map(o=>Object.assign({other:true},o)));
    let html=items.map((it,i)=>`<li role="option" data-i="${i}" aria-selected="${i===sel}"${it.other?' style="opacity:.75"':""}><span>${it.label}</span><i>${it.hint||""}</i></li>`).join("");
    const typed=fmtNew(input.value);
    if(allowNew&&typed&&!all.some(i=>fold(i.label)===fold(typed))&&!items.some(i=>fold(i.label)===fold(typed)))html+=`<li class="add" data-new="1">+ Usar “${typed}” (novo)</li>`;
    ul.innerHTML=html;ul.classList.toggle("hidden",!html);
  }
  input.addEventListener("input",()=>{clearTimeout(bt);sel=-1;onPick(null,true);render()});
  input.addEventListener("focus",()=>{clearTimeout(bt);render()});
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){sel=Math.min(items.length-1,sel+1);render();e.preventDefault()}
    else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);render();e.preventDefault()}
    else if(e.key==="Enter"&&sel>=0){pick(items[sel]);e.preventDefault()}
    else if(e.key==="Escape"){ul.classList.add("hidden")}
  });
  ul.addEventListener("mousedown",e=>e.preventDefault());
  ul.addEventListener("click",e=>{
    const li=e.target.closest("li");if(!li)return;
    if(li.dataset.new){const t=fmtNew(input.value);input.value=t;onPick({label:t,isNew:true});ul.classList.add("hidden")}
    else pick(items[+li.dataset.i]);
  });
  input.addEventListener("blur",()=>{bt=setTimeout(()=>ul.classList.add("hidden"),150)});
  function pick(it){input.value=it.label;onPick(it);ul.classList.add("hidden")}
  return {pick};
}
function setChips(){
  $("fam-indet").classList.toggle("on",cur.fam==="Indet");
  $("esp-indet").classList.toggle("on",cur.esp==="Indet");
}
const famAC=makeAC($("f-fam"),$("ul-fam"),
  ()=>families().map(f=>({label:f,hint:dictionary().filter(d=>d.f===f).length+" esp."})),
  (it,typing)=>{cur.fam=it?it.label:(typing?"":cur.fam);setChips();updateSave();if(!typing)reconcile()},true,fmtFamily);
function famFilter(){return cur.fam&&cur.fam!=="Indet"?cur.fam:null}
function reconcile(){
  // se a espécie já escolhida não pertence à família escolhida, limpa a espécie
  const fam=famFilter();if(!fam||!cur.esp||cur.esp==="Indet")return;
  const d=dictionary().find(x=>fold(x.s)===fold(cur.esp));
  if(d&&d.f!==fam){cur.esp="";$("f-esp").value="";toast("Espécie limpa: não é de "+fam);setChips();updateSave()}
}
const espAC=makeAC($("f-esp"),$("ul-esp"),
  ()=>{const fam=famFilter();return dictionary().filter(d=>!fam||d.f===fam).map(d=>({label:d.s,hint:fam?"":d.f,fam:d.f}))},
  (it,typing)=>{
    if(typing){cur.esp="";cur.espRaw=$("f-esp").value}
    else if(it){cur.esp=it.label;if(it.fam){cur.fam=it.fam;$("f-fam").value=it.fam}}
    setChips();updateSave();checkDup()},true,v=>{const t=fmtSpecies(v);return t.split(" ").length>=2?t:""},
  q=>{const fam=famFilter();return fam?dictionary().filter(d=>d.f!==fam&&fold(d.s).includes(q)).slice(0,5).map(d=>({label:d.s,hint:"é de "+d.f+" · trocar família",fam:d.f})):[]});
$("fam-indet").onclick=()=>{cur.fam="Indet";$("f-fam").value="Indet";setChips();updateSave()};
$("esp-indet").onclick=()=>{cur.esp="Indet";$("f-esp").value="Indet";setChips();updateSave()};
$("n-id").onclick=()=>openKeypad("id");
$("f-id").addEventListener("input",e=>{const v=e.target.value.replace(/\s+/g,"").toUpperCase();if(v!==e.target.value)e.target.value=v;cur.id=v;updateSave();checkDup()});
$("f-flag").addEventListener("input",e=>{cur.flag=e.target.value;updateSave()});
$("f-obs").addEventListener("input",e=>{cur.obs=e.target.value;updateSave()});

/* ---------- validation / save ---------- */
function missing(){
  const m=[];
  if(!ctx.mod)m.push("módulo");if(!ctx.par)m.push("parcela");if(!ctx.fai)m.push("faixa");if(!ctx.sub)m.push("subparcela");
  if(!ctx.lado)m.push("lado");
  if(!cur.id)m.push("ID");if(!cur.fam)m.push("família");if(!cur.esp)m.push("espécie");
  for(const k of ["dbh","h","x","y"])if(cur[k]==null)m.push(LIMITS[k].label.split(" ")[0]);
  cur.dbhs.forEach((v,i)=>{if(v==null)m.push("DBH"+(i+2))});
  return m;
}
function isDup(){
  return cur.id&&ctx.mod&&ctx.par&&ctx.fai&&ctx.sub&&ctx.lado&&records.some(r=>r.id===cur.id&&r.mod===ctx.mod&&r.par===ctx.par&&r.fai===ctx.fai&&r.sub===ctx.sub&&(r.lado||"")===ctx.lado);
}
function checkDup(){
  const box=$("dup-msg");box.innerHTML="";
  if(isDup())box.innerHTML='<p class="msg warn">Já existe o ID '+cur.id+' nesta subparcela (lado '+ctx.lado+'). Confira antes de salvar.</p>';
}
function mismatch(){
  if(!cur.esp||cur.esp==="Indet"||!cur.fam||cur.fam==="Indet")return null;
  const d=dictionary().find(x=>fold(x.s)===fold(cur.esp));
  return d&&d.f!==cur.fam?d.f:null;
}
function hasDraft(){const c=cur;return !!(c.id||c.fam||c.esp||c.dbh!=null||(c.dbhs&&c.dbhs.length)||c.h!=null||c.x!=null||c.y!=null||c.flag||c.obs||$("f-fam").value||$("f-esp").value)}
function saveDraft(){
  try{
    if(!hasDraft()){localStorage.removeItem(KEY_DRAFT);return}
    localStorage.setItem(KEY_DRAFT,JSON.stringify({cur,famTxt:$("f-fam").value,espTxt:$("f-esp").value,t:Date.now()}));
  }catch(e){}
}
/* sugestão do próximo ID: soma 1 ao número final do último ID salvo por você (23 → 24, A099 → A100, T9 → T10) */
function nextId(){
  if(!records.length)return null;
  const mine=records.filter(r=>r.by===clean(ctx.by));
  const pool=mine.length?mine:records;
  const last=pool.reduce((a,b)=>b.t>=a.t?b:a);
  const m=String(last.id).match(/^(.*?)(\d+)$/);if(!m)return null;
  let n=BigInt(m[2]);const ctxOk=ctx.mod&&ctx.par&&ctx.fai&&ctx.sub&&ctx.lado;
  for(let i=0;i<500;i++){
    n+=1n;const cand=m[1]+n.toString().padStart(m[2].length,"0");
    if(!ctxOk||!records.some(r=>r.id===cand&&r.mod===ctx.mod&&r.par===ctx.par&&r.fai===ctx.fai&&r.sub===ctx.sub&&(r.lado||"")===ctx.lado))return {id:cand,after:last.id};
  }
  return null;
}
function renderIdSug(){
  const box=$("id-sug");box.innerHTML="";
  if(cur.id)return;
  const n=nextId();if(!n)return;
  const b=document.createElement("button");b.className="chip on";b.textContent="Próximo: "+n.id+" (após "+n.after+")";
  b.onclick=()=>{cur.id=n.id;$("f-id").value=n.id;renderNums();updateSave();checkDup()};
  box.appendChild(b);
}
function updateSave(){

  $("btn-save").textContent=m.length?("Falta: "+m.slice(0,3).join(", ")+(m.length>3?"…":"")):"Salvar árvore";
  $("btn-undo").disabled=!hasDraft();
}

/* ---------- export ---------- */
function buildWorkbook(){
  const n=Math.max(1,...records.map(r=>1+(r.dbhs||[]).length));
  const dcols=Array.from({length:n},(_,i)=>"DBH"+(i+1));
  const head=["Módulo","Parcela","Faixa","Subparcela","ID","Familia","Especie",...dcols,"Height","Flag","Lado","X","Y","Coletor","DataHora","Observacoes"];
  const rows=records.map(r=>{const d=[r.dbh,...(r.dbhs||[])];while(d.length<n)d.push("");return [r.mod,r.par,r.fai,r.sub,(/^\d+$/.test(r.id)?+r.id:r.id),r.fam,r.esp,...d,r.h,r.flag||"",r.lado||"",r.x,r.y,r.by||"",fmtDT(r.t),r.obs||""]});
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws["!cols"]=[14,8,7,11,12,20,30,...dcols.map(()=>8),8,24,6,7,7,14,17,34].map(w=>({wch:w}));
  ws["!freeze"]={xSplit:0,ySplit:1};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Dados");
  return wb;
}
function pad2(n){return String(n).padStart(2,"0")}
function stamp(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function fmtDT(t){if(!t)return"";const d=new Date(t);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())}
async function saveFile(name,data,mime){
  try{const dl=window.claude&&await claude.use("downloads");if(dl){await dl.save({filename:name,data});return true}}
  catch(e){if(e&&e.code==="declined")return false}
  try{const blob=new Blob([data],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
  catch(e){toast("Não foi possível baixar o arquivo");return false}
}
$("btn-xlsx").onclick=async()=>{
  if(!records.length){toast("Nada para exportar ainda");return}
  if(typeof XLSX==="undefined"){toast("Biblioteca do Excel não carregou. Reabra o arquivo.");return}
  const buf=XLSX.write(buildWorkbook(),{bookType:"xlsx",type:"array"});
  if(await saveFile("peld_arvores_"+stamp()+".xlsx",buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")){noteBackup();toast("Excel salvo")}
};

const isNum=(v,lo,hi)=>typeof v==="number"&&isFinite(v)&&v>=lo&&v<=hi;
function sanitizeRec(r){
  if(!r||typeof r!=="object")return null;
  const par=+r.par,fai=+r.fai,sub=+r.sub,id=String(r.id||"").replace(/\s+/g,"").toUpperCase();
  const dbhs=Array.isArray(r.dbhs)?r.dbhs:[];
  if(!MODULOS.includes(r.mod)||![1,2,3,4,5].includes(par)||![2,3].includes(fai)||!(sub>=1&&sub<=50&&Number.isInteger(sub))||!id)return null;
  if(!isNum(r.dbh,LIMITS.dbh.min,LIMITS.dbh.max)||!dbhs.every(v=>isNum(v,LIMITS.dbh.min,LIMITS.dbh.max)))return null;
  if(!isNum(r.h,LIMITS.h.min,LIMITS.h.max)||!isNum(r.x,0.01,10)||!isNum(r.y,0.01,10))return null;
  const fam=fmtFamily(r.fam),esp=fmtSpecies(r.esp);if(!fam||!esp)return null;
  const t=+r.t||Date.now();
  const lado=String(r.lado||"").trim().toUpperCase();
  return {t,at:Date.now(),uid:r.uid||("imp-"+(r.by||"")+"-"+t+"-"+id),by:clean(r.by),mod:r.mod,par,fai,sub,id,fam,esp,dbh:r.dbh,dbhs:dbhs.slice(),h:r.h,lado:(lado==="D"||lado==="E")?lado:"",flag:clean(r.flag),obs:cleanObs(r.obs),x:r.x,y:r.y};
}
const sameKey=(a,b)=>a.mod===b.mod&&a.par===b.par&&a.fai===b.fai&&a.sub===b.sub&&a.id===b.id&&(a.lado||"")===(b.lado||"");
const sig=r=>JSON.stringify([r.fam,r.esp,r.dbh,r.dbhs,r.h,r.x,r.y,r.flag,r.lado||"",r.obs||""]);
const descRec=r=>esc(r.fam+" · "+r.esp+" · DBH "+[r.dbh,...(r.dbhs||[])].map(v=>fmtNum(v,1)).join("+")+" · H "+fmtNum(r.h,1)+(r.lado?" · Lado "+r.lado:"")+" · X "+fmtNum(r.x,2)+" Y "+fmtNum(r.y,2)+(r.flag?" · Flag: "+r.flag:"")+(r.obs?" · Obs: "+r.obs.replace(/\n+/g," / "):""));
$("btn-import").onclick=()=>$("file-in").click();
$("file-in").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  const incoming=[];let bad=0;const badFiles=[];let dictAdded=0;
  for(const f of files){
    try{
      const j=JSON.parse(await f.text());
      if(j.app!=="peld-coleta"||!Array.isArray(j.records))throw new Error("formato");
      for(const r of j.records){const v=sanitizeRec(r);if(v)incoming.push(v);else bad++}
      for(const d of (Array.isArray(j.dictExtra)?j.dictExtra:[])){
        if(d&&typeof d.s==="string"&&typeof d.f==="string"){
          const sp=fmtSpecies(d.s),fm=fmtFamily(d.f);
          if(sp&&fm&&sp.split(" ").length>=2&&!dictionary().some(x=>fold(x.s)===fold(sp))){extra.push({f:fm,s:sp});dictAdded++}
        }
      }
    }catch(err){badFiles.push(f.name)}
  }
  let added=0,same=0,already=0;const conflicts=[];
  for(const r of incoming){
    if(records.some(x=>x.uid===r.uid)){already++;continue}
    const hit=records.find(x=>sameKey(x,r));
    if(!hit){records.push(r);added++}
    else if(sig(hit)===sig(r))same++;
    else conflicts.push({cur:hit,inc:r});
  }
  save(KEY_DATA,records);save(KEY_DICT,extra);renderAll();renderDict();
  let h='<h3>Importação concluída</h3><p>'
    +'<b>'+added+'</b> árvore(s) nova(s) adicionada(s)<br>'
    +'<b>'+(same+already)+'</b> já estavam aqui (iguais ou já importadas)<br>'
    +(dictAdded?'<b>'+dictAdded+'</b> espécie(s) nova(s) no dicionário<br>':'')
    +(bad?'<b>'+bad+'</b> registro(s) inválido(s) ignorado(s)<br>':'')
    +(badFiles.length?'Arquivo(s) não reconhecido(s): '+esc(badFiles.join(", "))+'<br>':'')
    +'</p>';
  if(conflicts.length){
    h+='<div class="msg warn">'+conflicts.length+' conflito(s): mesmo local e ID, mas dados diferentes. Escolha qual vale. O que não for escolhido fica como está (o atual).</div>';
    conflicts.forEach((c,i)=>{
      h+=`<div class="conf" id="cf-${i}"><b>${esc(c.cur.mod)} · P${c.cur.par} F${c.cur.fai} · Sub ${c.cur.sub}${c.cur.lado?" "+c.cur.lado:""} · ID ${esc(c.cur.id)}</b>
      <p><b>Atual</b> (${esc(c.cur.by||"sem nome")}): ${descRec(c.cur)}</p>
      <p><b>Importada</b> (${esc(c.inc.by||"sem nome")}): ${descRec(c.inc)}</p>
      <div class="row2"><button class="ghost" data-keep="${i}">Manter atual</button><button class="ghost" data-use="${i}">Usar importada</button></div></div>`;
    });
  }
  h+='<button class="primary" id="imp-ok" style="width:100%;margin-top:10px">Concluir</button>';
  openSheet(h);
  const sh=$("sheet");
  const mark=(i,txt)=>{const el=sh.querySelector("#cf-"+i+" .row2");el.innerHTML='<span class="done">'+txt+'</span>'};
  sh.querySelectorAll("[data-keep]").forEach(b=>b.onclick=()=>mark(+b.dataset.keep,"✔ Mantida a atual"));
  sh.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{
    const c=conflicts[+b.dataset.use],ix=records.indexOf(c.cur);
    if(ix>=0){records[ix]=c.inc;save(KEY_DATA,records);renderAll()}
    mark(+b.dataset.use,"✔ Substituída pela importada");
  });
  $("imp-ok").onclick=closeSheet;
};

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
(async function reconcileMirror(){   // se o armazenamento principal perdeu algo, a cópia interna recupera
  const m=await idbGet(KEY_DATA);
  if(Array.isArray(m)&&m.length){
    const have=new Set(records.map(r=>r.uid)),missing=m.filter(r=>r&&r.uid&&!have.has(r.uid));
    if(missing.length){
      askConfirm("Recuperar dados?","Encontrei <b>"+missing.length+"</b> registro(s) na cópia interna de segurança que não aparecem na lista. Restaurar?","Restaurar",()=>{
        missing.forEach(r=>{r.at=Date.now();records.push(r)});save(KEY_DATA,records);renderAll();toast(missing.length+" registro(s) recuperado(s)");
      },false,true,"Agora não");
      return;
    }
  }
  const md=await idbGet(KEY_DICT);
  if(Array.isArray(md)&&md.length){let n=0;md.forEach(d=>{if(d&&d.s&&d.f&&!dictionary().some(x=>fold(x.s)===fold(d.s))){extra.push(d);n++}});if(n)save(KEY_DICT,extra)}
  idbSet(KEY_DATA,records);
})();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
